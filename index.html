* { box-sizing: border-box; }

t Snuffy on the wash rack, hand the boy a hose,","He can't break nothin' there, Lord, that's how the story goes.","Just soap and water, son, and stay out of the jet,","The cleanest Eagle in the Pacific, and nothin's on fire yet."]},{"name":"Verse 3","lines":["Well the general came to visit and he looked down that ramp,","Said 'Who washed these Eagles? They're shinin' like a lamp!'","They pinned a stripe on Snuffy, and he cried into his suds,"]},{"name":"Final Chorus","lines":["Then he dropped the brand-new stripe right down the wash rack drain, bud.","So keep Snuffy on the wash rack, hand the boy a hose,","He can't break nothin' there, Lord, that's how the story goes.","Senior Airman Snuffy, the king of soap and spray."]},{"name":"Outro","lines":["(Somebody take that hose away.)"]}]},{"n":5,"title":"Stall Number Three","explicit":false,"secs":168,"src":"vol1/tracks/05.mp4","art":"vol1/cover.jpg","side":"","about":"A sleepy bossa-nova lullaby for the airman who disappears every time a FOD walk is called, into the hangar latrine, stall number three, feet up so nobody sees his boots.","lyrics":[{"name":"Verse 1","lines":["Oh-seven-hundred, the Pro Super calls the FOD walk,","Everybody lines up at arm's length, no time to talk.","But I'm already gone, like a breeze across the ramp,","To a quiet little kingdom by the hangar's broken lamp."]},{"name":"Chorus","lines":["Stall number three, (ooh, stall number three)","Feet up on the door so the boots can't see.","While they're findin' rocks and bolts out there in the sun,","I'm dreamin' of a world where the FOD walk is done."]},{"name":"Verse 2","lines":["The hand dryer hums me a lullaby so sweet,","I fold my reflective belt into a pillow, nice and neat.","I hear 'em sweepin' by, someone found a safety wire,","But I'm floatin' on a cloud, and I'm not about to retire."]},{"name":"Chorus","lines":["Stall number three, (ooh, stall number three)","Feet up on the door so the boots can't see.","While they're findin' rocks and bolts out there in the sun,","I'm dreamin' of a world where the FOD walk is done."]},{"name":"Bridge","lines":["Then a knock comes on the door, my heart stops cold,","A voice says 'Airman, you in there?' and it sounds real old.","I hold my breath, I lift my feet, I'm good as gone,"]},{"name":"Final Chorus","lines":["Then the Chief says 'Scoot over, son, I'm in stall four, carry on.'","Stall number three, and the Chief in four,","Two men of honor, feet up on the door,","While they find the FOD out there, we'll sleep the morning through, ooh."]},{"name":"Outro","lines":["(FOD walk complete... nothing found.)"]}]},{"n":6,"title":"Chow Run","explicit":false,"secs":170,"src":"vol1/tracks/06.mp4","art":"vol1/cover.jpg","side":"Side B · The work","about":"A laid-back reggae prayer from a crew chief stuck on the ramp since 0500, hoping, hoping, the expediter will come pick him up for chow today.","lyrics":[{"name":"Intro","lines":["Expediter, expediter... any chance of a chow run? ...Over."]},{"name":"Verse 1","lines":["Been out here on the ramp since oh-five-hundred, mon,","Missed the breakfast, missed the lunch, and the sun is gettin' strong.","I can see the chow hall shinin' way across the field,","But my feet are tired, and a crew chief's gotta stay with his steel."]},{"name":"Chorus","lines":["I hope the expediter picks me up for chow today, (chow today)","Roll on by in that white truck and carry me away. (Carry me away)","I'll ride in the bed with the toolbox, I don't care what they say,","Oh, I hope the expediter picks me up for chow today."]},{"name":"Verse 2","lines":["Here he comes a-rollin', I can see the dust and the beacon spin,","But he picked up the load crew, said they're fifteen minutes in.","Then he swung back 'round the hangar and I waved with all my might,","But he just honked and yelled 'Good luck!' like the day he ran me over last night."]},{"name":"Chorus","lines":["I hope the expediter picks me up for chow today, (chow today)","Roll on by in that white ut that jet'll fly tomorrow, 'cause that's what crew chiefs do.","Sign it off, I'll see her later, she's got nothin' left to prove,","I got the Red X blues."]}]},{"n":9,"title":"Hot Lovin' at the Trim Pad","explicit":false,"secs":176,"src":"vol1/tracks/09.mp4","art":"vol1/cover.jpg","side":"","about":"A 70s funk-soul slow jam that sounds like a seduction and turns out to be an engine troop's love song to an F100 at full afterburner on the trim pad.","lyrics":[{"name":"Intro","lines":["Mmm... it's oh-two-hundred, baby. Let's go out to the trim pad."]},{"name":"Verse 1","lines":["I picked her up at the hangar, she was lookin' so fine,","Got a tow out to the trim pad, we were right on time.","Tied her down nice and gentle, checked her intake real slow,","Then I whispered in her headset, 'Baby, let's go.'"]},{"name":"Chorus","lines":["Hot lovin' at the trim pad, (ooh, hot lovin')","Fire in her burner, baby, burnin' bright and bad.","Ninety-eight percent, oh, she's movin' me so,","Hot lovin' at the trim pad, don't let go."]},{"name":"Verse 2","lines":["Her EGT was risin', and my heart was too,","Her nozzle opened wide, oh, I knew just what to do.","I took her into burner, and she shook the whole base,","Base housing called the MOC, but I couldn't wipe this smile off my face."]},{"name":"Chorus","lines":["Hot lovin' at the trim pad, (ooh, hot lovin')","Fire in her burner, baby, burnin' bright and bad.","Ninety-eight percent, oh, she's movin' me so,","Hot lovin' at the trim pad, don't let go."]},{"name":"Bridge","lines":["Then the radio crackled... it was the Pro Super.","He said 'Trim pad, you've been at max power for forty minutes.'","I said, 'Sir... she needed it.'"]},{"name":"Final Chorus","lines":["Hot lovin' at the trim pad, (ooh, hot lovin')","She's an F100, baby, the best I've ever had.","Cut her back to idle, now we're cooling nice and slow,","Hot lovin' at the trim pad, oh, don't let go."]},{"name":"Outro","lines":["Same time tomorrow night, baby? ...I'll bring the engine run checklist."]}]},{"n":10,"title":"Gear Up Gary","explicit":false,"secs":144,"src":"vol1/tracks/10.mp4","art":"vol1/cover.jpg","side":"","about":"A rockabilly tear-up, sung by the maintainers, about the hotshot pilot who keeps raising the gear before the jet leaves the ground, and the crew that has to jack it back up every time.","lyrics":[{"name":"Intro","lines":["One, two, gear up, oh no!"]},{"name":"Verse 1","lines":["Well, Gary was a hotshot with a brand-new call sign,","Burners lit, he's rollin', man, he's doin' just fine.","Fifty knots, sixty knots, his hand begins to creep,","He slaps that gear handle up, and the jet goes in a heap!"]},{"name":"Chorus","lines":["Gear up, Gary! (Not yet, Gary!)","Sparks are flyin' down the runway, it's the scariest thing,","Gear up, Gary! (Oh no, Gary!)","Crew chiefs cryin' by the hangar and the fire trucks sing!"]},{"name":"Verse 2","lines":["We jacked it up on Monday, swapped the panels and the doors,","Sheet metal workin' double shifts and sweepin' up the floors.","We signed it off on Thursday, Gary said 'I've learned my lesson',","Then he did it on Friday, and the Wing called a session!"]},{"name":"Chorus","lines":["Gear up, Gary! (Not yet, Gary!)","Sparks are flyin' down the runway, it's the scariest thing,","Gear up, Gary! (Oh no, Gary!)","Crew chiefs cryin' by the hangar and the fire trucks sing!"]},{"name":"Bridge","lines":["So we zip-tied the handle, put a sign that said 'NOT YET',","Duct-taped a picture of the Commander on the panel of the jet.","Gary saw the sign and he grinned and he said 'Watch this',"]},{"name":"Final Chorus","lines":["He pulled the handle with his teeth, and the jet went down like this!","Gear up, Gary! (Now we call him 'Sled'!)","He's flyin' a desk at the Pentagon instead,","Gear up, Gary! (Thank you, Gary!) We've got the overtime to show!"]},{"name":"Outro","lines":["(Somebody get the jacks!)"]}]},{"n":11,"title":"What's Bitchin' Betty Bitchin' About Now","explicit":false,"secs":182,"src":"vol1/tracks/11.mp4","art":"vol1/cover.jpg","side":"","about":"A drunken barroom country song: a fighter pilot at the O Club bar crying in his beer about Bitchin' Betty, the calm female voice in the cockpit warning system, like she's his ex-wife. She is always, always right.","lyrics":[{"name":"Intro","lines":["(Betty:) Warning. Warning.","Aw, here she goes..."]},{"name":"Verse 1","lines":["Bartender, pour me another, I been flyin' all day long,","There's a woman in my helmet and she tells me I'm wrong.","I pulled nine G's like a cowboy, I was livin' proud,","So tell me, what's Bitchin' Betty bitchin' about now?"]},{"name":"Betty Hook","lines":["(Betty:) Altitude. Altitude.","(Betty:) Pull up. Pull up."]},{"name":"Chorus","lines":["What's Bitchin' Betty bitchin' about now? (Bingo fuel.)","She's been nagging me since the day I took the vow. (Over-G.)","I'm the best there is, I'm the one with the crown,","So what's Bitchin' Betty bitchin' about now? (Pull up.)"]},{"name":"Verse 2","lines":["She don't care about my call sign, she don't like my aviators,","She don't laugh at all my jokes, she just says 'See you later.'","She said 'Engine fire', I said 'Honey, you're overreactin',","Now I'm drinkin' at the O Club and my jet is in a crater."]},{"name":"Chorus","lines":["What's Bitchin' Betty bitchin' about now? (Engine fire.)","She's been nagging me since the day I took the vow. (Left engine.)","I'm the best there is, I'm the one with the crown,","So what's Bitchin' Betty bitchin' about now? (Eject.)"]},{"name":"Bridge","lines":["Gear Up Gary's at the end of the bar, he raised his glass to me,","Said 'Son, she's right about everything... and so was my ex-wife, Marie.'"]},{"name":"Final Chorus","lines":["So I'll listen to Betty next time, I swear it on my crown,","I'll say 'Yes, ma'am,' and 'Pull up', and I'll never let her down.","But tonight I'm crying in my whiskey, and the bartender's sayin' 'Now...'","Oh, what's Bitchin' Betty bitchin' about now?"]},{"name":"Outro","lines":["(Betty:) Last call. Last call.","(Betty:) I told you so."]}]}]},{"id":"vol2","album":"Tales from the Flightline, Vol. 2","short":"Vol. 2","blurb":"The characters, the TDYs and the night shift, in 10 songs. It ends where every flightline week ends: Saturday morning.","artist":"The Red X Band","year":2026,"copyright":"© 2026 Mellivora Systems LLC. Original songs; music and vocals made with ElevenLabs Music.","cover":"vol2/cover.jpg","tracks":[{"n":1,"title":"Shift Wars","explicit":false,"secs":166,"src":"vol2/tracks/01.mp4","art":"vol2/cover.jpg","side":"Side A · The cast of characters","about":"A 90s boom-bap rap battle between day shift, swing shift and mids, each blaming the others for the broke jets, the empty coffee pot, the missing tools and the shift turnover that never happened.","lyrics":[{"name":"Intro","lines":["(Hype man:) Ladies and gentlemen... in this corner... DAY SHIFT! (Crowd: Ohhh!) And in this corner... SWINGS! And somewhere in the dark... MIDS!"]},{"name":"Hook","lines":["Shift wars! (Shift wars!) Who broke the jet?","Shift wars! (Shift wars!) Ain't nobody done turnover yet!"]},{"name":"Day Shift Verse","lines":["Day shift, baby, we launch the morning go,","We got the Pro Super, the Chief, and the commander's show.","We come in at oh-five, and the coffee pot's dry,","Swing shift left a jet with ninety panels off, and I'm askin' why!","Toolbox missin' a ratchet, CTK all wrong,","And the turnover sheet just says 'Good luck' all along!"]},{"name":"Hook","lines":["Shift wars! (Shift wars!) Who broke the jet?","Shift wars! (Shift wars!) Ain't nobody done turnover yet!"]},{"name":"Swing Shift Verse","lines":["Swings in the building, we do the real work, son,","Day shift breaks it by noon, then they say 'We're done!'","You leave at three-thirty with your Starbucks and your pride,","We fix every jet you broke while you're home with your bride!","And that ratchet you're cryin' 'bout, it's in your pocket, chief,","Check your coveralls, day shift, and give me some relief!"]},{"name":"Hook","lines":["Shift wars! (Shift wars!) Who broke the jet?","Shift wars! (Shift wars!) Ain't nobody done turnover yet!"]},{"name":"Mids Verse","lines":["Mids... we don't talk... we just work all night...","Under one floodlight, eatin' Pop-Tarts, outta sight.","Y'all argue all day while we fix it in the dark,","Then we leave you a note, and you never read the remark.","We ain't seen the sun since two thousand twenty-three,","Mids don't fight, y'all... we just fix it... quietly."]},{"name":"Final Hook","lines":["Shift wars! (Shift wars!) Truth is, we all broke the jet!","Shift wars! (Shift wars!) But the Pro Super ain't signed the turnover yet!","Shift wars! (Shift wars!)"]},{"name":"Outro","lines":["(Hype man:) And the winner is... nobody! Shift change in five minutes! (Crowd: Ohhh!)"]}]},{"n":2,"title":"StaffSquatch","explicit":false,"secs":162,"src":"vol2/tracks/02.mp4","art":"vol2/cover.jpg","side":"","about":"A spooky surf-rock cryptid legend about StaffSquatch, the elusive staff sergeant only ever glimpsed from far across the flightline, always a little fuzzy, never close enough to help.","lyrics":[{"name":"Intro","lines":["(Narrator:) For years, maintainers have whispered of a creature... seen only at a distance... on the far end of the ramp."]},{"name":"Verse 1","lines":["I saw it at the end of Row C, standin' by the AGE,","Eight feet tall with four stripes on, in a reflective belt, all the rage.","I yelled 'Hey Sarge, I need a hand!' and I blinked my eyes,","And all that's left was a coffee cup, still warm, and a box of Pop-Tart supplies."]},{"name":"Chorus","lines":["StaffSquatch, (ooh-wee-ooh)","Always far away, and always kinda fuzzy too.","Never at the jet when the work comes due,","StaffSquatch, (ooh-wee-ooh)."]},{"name":"Verse 2","lines":["We set up a trail cam by the break room door,","Got a blurry shape with a clipboard, and nothin' more.","Found boot prints by the snack bar, size eleven, wide,","Heard 'Copy' on the radio, but there was no one there outside."]},{"name":"Chorus","lines":["StaffSquatch, (ooh-wee-ooh)","Always far away, and always kinda fuzzy too.","Never at the jet when the work comes due,","StaffSquatch, (ooh-wee-ooh)."]},{"name":"Bridge","lines":["(Narrator:) Then the Pro Super formed a search party, arm's length, like a FOD walk.","(Narrator:) They searched every hangar... every shelter... every stall.","(Narrator:) And then... on the day promotion results were released..."]},{"name":"Final Chorus","lines":["There it was, in focus, crystal clear and right on cue,","Front row at the promotion party, first in line for barbecue.","Made Tech Sergeant, shook the Chief's hand, and it vanished from our view,","StaffSquatch, (ooh-wee-ooh)!"]},{"name":"Outro","lines":["(Narrator:) It has not been seen since. But if you look closely... at the far end of the ramp... it's still a little fuzzy."]}]},{"n":3,"title":"Patch Lover","explicit":false,"secs":156,"src":"vol2/tracks/03.mp4","art":"vol2/cover.jpg","side":"","about":"A 1960s surf-pop love song for the airman who trades, hoards and Velcros every squadron and morale patch on Earth, until the whole base knows him as the Patch Lover.","lyrics":[{"name":"Intro","lines":["Ooh-ooh, patch lover..."]},{"name":"Verse 1","lines":["Got a sloth in a flight suit, got a 'Don't Make Me Repeat Myself',","Got the Fighting Eagles and the Swamp Foxes on the bookshelf.","Every TDY I'm tradin' at the bar till the lights go out,","If a squadron's got a patch, baby, I've already got it, no doubt."]},{"name":"Chorus","lines":["'Cause I'm a patch lover, (patch lover)","Velcro on my heart and on my covers.","From the Pacific to the desert sand, I'll trade you two for one,","I'm a patch lover, and I'm never done."]},{"name":"Verse 2","lines":["My flight jacket weighs forty pounds and it sticks to every chair,","My wife came home and found the kitchen walls all Velcro'd everywhere.","The Shirt said 'Son, those ain't authorized on OCPs today,'","So I stuck 'em on the inside, now I'm crinkly every day."]},{"name":"Chorus","lines":["'Cause I'm a patch lover, (patch lover)","Velcro on my heart and on my covers.","From the Pacific to the desert sand, I'll trade you two for one,","I'm a patch lover, and I'm never done."]},{"name":"Bridge","lines":["Then one night at the O Club, a girl walked through the door,","Her jacket had a thousand patches, maybe even more.","She had the one I'd searched for, the rarest in the land,"]},{"name":"Final Chorus","lines":["It just said 'PATCH LOVER', and she stuck it in my hand!","Now we're patch lovers, (patch lovers),","Velcro'd at the altar, under matching covers,","We'll trade for the rest of our lives, never done."]},{"name":"Outro","lines":["(Got any doubles?)"]}]},{"n":4,"title":"Piggybackin' (Off the Commander Again)","explicit":false,"secs":164,"src":"vol2/tracks/04.mp4","art":"vol2/cover.jpg","side":"","about":"A gospel revival about the Chief who, at every commander's call, steps up 'just to piggyback off what the commander said', and says it all again, only longer.","lyrics":[{"name":"Intro","lines":["Can I get a commander's call up in here? (Yes!)"]},{"name":"Verse 1","lines":["The commander took the podium, said 'Safety's number one,' (Number one!)","'Hydrate, take your leave, and have some fun.' (Have some fun!)","Five minutes, short and sweet, we could almost see the door, (The door!)","Then the Chief stood up, and said 'Just one thing more...' (Oh no!)"]},{"name":"Chorus","lines":["He's piggybackin', (piggybackin'!)","Off the commander again, (again!)","Sayin' what he just said, but forty minutes long, my friend,","Oh, the Chief is piggybackin' off the commander again!"]},{"name":"Verse 2","lines":["'Just to piggyback, folks, like the commander said,' (He said!)","'Safety's number one, and I mean it,' and he nodded his head. (His head!)","Then he told us 'Hydrate,' and he told us how he hydrated in ninety-three, (Ninety-three!)","And he told us 'Take your leave,' while we were takin' leave of reality! (Lord!)"]},{"name":"Chorus","lines":["He's piggybackin', (piggybackin'!)","Off the commander again, (again!)","Sayin' what he just said, but forty minutes long, my friend,","Oh, the Chief is piggybackin' off the commander again!"]},{"name":"Bridge","lines":["Then the commander said 'Dismissed,' and we started to rise, (Rise!)","But the Chief said 'Piggyback on dismissed,' and we closed our eyes. (Oh Lord!)","Then the commander stood back up and said 'Just to piggyback on the Chief'..."]},{"name":"Final Chorus","lines":["Now they're piggybackin', (piggybackin'!)","Off each other again, (again!)","Commander's call started Monday, and it's Thursday, and it won't end,","Oh, they're piggybackin' off each other again! (Amen!)"]},{"name":"Outro","lines":["(Just to piggyback off that Amen... Amen.)"]}]},{"n":5,"title":"Spares Are Free (The Pro Super Song)","explicit":false,"secs":144,"src":"vol2/tracks/05.mp4","art":"vol2/cover.jpg","side":"","about":"In the spirit of the flightline songs maintainers pass around, about the Pro Super everybody has worked for.","lyrics":[{"name":"Verse 1","lines":["I've been Pro Super since the jets had props,","Got a radio, a coffee, and a truck that never stops.","The schedule says fourteen, I said make it twenty-two,","'Cause spares are free, son, there's nothing else to do."]},{"name":"Chorus","lines":["Cann it, cann it, cann it, boys,","The part gets here by noon? I don't care, I like the noise.","Hot pits for Ops? Well sure, we'll find a crew.","I'm the Pro Super, and this is what I do."]},{"name":"Verse 2","lines":["Weapons came a-runnin' with the SCL,","I said, \"That's the one with bombs,\" they looked at me like, well.","I wrote the 2407 on the back of a receipt,","Four more jets and a config change on the turn, now ain't that sweet."]},{"name":"Chorus","lines":[]},{"name":"Bridge","lines":["The lieutenant reads the forms, bless his little heart,","MXS went home at three and took my only part.","I've been retiring next year since two thousand nine,","But somebody's gotta fill this flying schedule line."]},{"name":"Final chorus","lines":[]},{"name":"Outro (spoken)","lines":["...Make it a spare."]}]},{"n":6,"title":"Sambuca Sunrise","explicit":false,"secs":155,"src":"vol2/tracks/06.mp4","art":"vol2/cover.jpg","side":"Side B · After hours","about":"A TDY honky-tonk drinking song: launching jets on a few hours of sleep after a night of Sambuca, face down in the biscuits and gravy, and it's all right, because the pilot looks worse.","lyrics":[{"name":"Verse 1","lines":["We were TDY in a town I can't pronounce,","The bar had Sambuca and they served it by the ounce.","Somebody lit the shots on fire, somebody lit the bill,","And somebody said 'crew show's at five', and I'm still feelin' ill."]},{"name":"Chorus","lines":["It's a Sambuca sunrise, with my face in biscuits and gravy,","Sunglasses on the flightline, and my hands are shakin' maybe.","But I'll launch these jets on time, boys, I'll marshal 'em out real slow,","'Cause it's all right, the pilot's worse than me, and he's the one who's gotta go."]},{"name":"Verse 2","lines":["I pulled the chocks, I pulled the pins, I think I counted right,","The engines started screamin' and I begged 'em, 'not so bright'.","Then the pilot climbed the ladder, he was greener than the jet,","He gave me a thumbs up and he whispered, 'not one word yet'."]},{"name":"Chorus","lines":["It's a Sambuca sunrise, with my face in biscuits and gravy,","Sunglasses on the flightline, and my hands are shakin' maybe.","But I'll launch these jets on time, boys, I'll marshal 'em out real slow,","'Cause it's all right, the pilot's worse than me, and he's the one who's gotta go."]},{"name":"Bridge","lines":["The Pro Super saw my eyes and said, 'Son, drink some water,'","Then he poured himself a coffee and said, 'Don't tell my daughter.'"]},{"name":"Final Chorus","lines":["It's a Sambuca sunrise, with my face in biscuits and gravy,","W const ALBUMS = DATA.albums;
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = l => l.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const audio = $('audio'), list = $('list');
let shown = 0;                       // the album on screen
let playing = { a: -1, order: [], pos: -1 }; // the album the player is working through
$('foot').textContent = ALBUMS[0].copyright;

if (ALBUMS.length > 1) {
  $('vols').hidden = false;
  ALBUMS.forEach((A, k) => {
    const b = document.createElement('a'); b.className = 'vol'; b.href = '#' + A.id;
    b.innerHTML = '<img alt="" src="' + A.cover + '"><span></span>'; b.querySelector('span').textContent = A.short || A.album;
    b.addEventListener('click', e => { e.preventDefault(); show(k); window.scrollTo({ top: 0 }); });
    $('vols').appendChild(b);
  });
}

function show(k) {
  shown = k; const A = ALBUMS[k];
  [...$('vols').children].forEach((b, j) => b.setAttribute('aria-current', String(j === k)));
  $('heroCover').src = A.cover; $('heroCover').alt = A.album + ' album cover';
  $('albumTitle').textContent = A.album; $('artist').textContent = A.artist;
  $('meta').textContent = A.year + ' · Comedy · Original songs';
  $('blurb').textContent = A.blurb; $('count').textContent = A.tracks.length;
  $('total').textContent = Math.floor(A.tracks.reduce((t, x) => t + x.secs, 0) / 60) + ' min';
  document.title = ALBUMS.length > 1 ? 'Tales from the Flightline' : A.album;
  list.innerHTML = '<div class="form-head"><span>Item</span><span>Title</span><span>Time</span><span>Lyrics</span></div>';
  A.tracks.forEach((t, i) => {
    if (t.side) { const d = document.createElement('div'); d.className = 'side'; d.textContent = t.side; list.appendChild(d); }
    const el = document.createElement('div'); el.className = 'track'; el.id = 'a' + k + 't' + i;
    if (playing.a === k && playing.order[playing.pos] === i) el.classList.add('on');
    const row = document.createElement('div'); row.className = 'row'; row.tabIndex = 0; row.setAttribute('role', 'button');
    row.setAttribute('aria-label', 'Play ' + t.title);
    row.innerHTML = '<span class="num">' + String(t.n).padStart(2, '0') + '</span><span class="ttl"><img class="art" alt="" loading="lazy" src="' + t.art + '"><b></b><small></small></span><span class="dur">' + fmt(t.secs) + '</span>';
    row.querySelector('b').textContent = t.title;
    if (t.explicit) row.querySelector('b').insertAdjacentHTML('beforeend', '<span class="e" title="Explicit">E</span>');
    row.querySelector('small').textContent = t.about;
    const lb = document.createElement('button'); lb.className = 'lyr'; lb.type = 'button'; lb.textContent = 'Lyrics'; lb.setAttribute('aria-expanded', 'false');
    row.appendChild(lb);
    const ly = document.createElement('div'); ly.className = 'lyrics'; ly.hidden = true;
    t.lyrics.filter(s => s.lines.length).forEach(s => { const sec = document.createElement('section'); const h = document.createElement('h4'); h.textContent = s.name; const p = document.createElement('p'); p.innerHTML = s.lines.map(esc).join('<br>'); sec.append(h, p); ly.appendChild(sec); });
    lb.addEventListener('click', e => { e.stopPropagation(); ly.hidden = !ly.hidden; lb.setAttribute('aria-expanded', String(!ly.hidden)); });
    row.addEventListener('click', () => play(k, i));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(k, i); } });
    el.append(row, ly); list.appendChild(el);
  });
}

function setIcon(on) { $('ppIcon').innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; $('pp').setAttribute('aria-label', on ? 'Pause' : 'Play'); }
function play(k, i, order) {
  const A = ALBUMS[k];
  if (order) playing.order = order; else if (playing.a !== k || !playing.order.length) playing.order = A.tracks.map((_, j) => j);
  playing.a = k; playing.pos = playing.order.indexOf(i);
  const t = A.tracks[i];
  document.querySelectorAll('.track.on').forEach(e => e.classList.remove('on'));
  const el = $('a' + k + 't' + i); if (el) el.classList.add('on');
  $('player').hidden = false; $('npArt').src = t.art; $('npTitle').textContent = t.n + '. ' + t.title; $('len').textContent = fmt(t.secs);
  audio.src = t.src; audio.play().catch(() => setIcon(false));
  try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: A.artist, album: A.album, artwork: [{ src: t.art, type: 'image/jpeg' }] }); } catch (e) {}
}
function step(d) {
  if (playing.a < 0) return play(shown, 0);
  const p = playing.pos + d;
  if (p >= 0 && p < playing.order.length) play(playing.a, playing.order[p]);
}
$('playAll').addEventListener('click', () => play(shown, 0, ALBUMS[shown].tracks.map((_, j) => j)));
$('shuffle').addEventListener('click', () => { const o = ALBUMS[shown].tracks.map((_, j) => j); for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; } play(shown, o[0], o); });
$('pp').addEventListener('click', () => { if (playing.a < 0) return play(shown, 0); audio.paused ? audio.play() : audio.pause(); });
$('next').addEventListener('click', () => step(1));
$('prev').addEventListener('click', () => audio.currentTime > 3 ? (audio.currentTime = 0) : step(-1));
audio.addEventListener('play', () => setIcon(true));
audio.addEventListener('pause', () => setIcon(false));
audio.addEventListener('ended', () => step(1));
let seeking = false;
$('seek').addEventListener('input', () => { seeking = true; $('cur').textContent = fmt($('seek').value / 100 * (audio.duration || 0)); });
$('seek').addEventListener('change', () => { if (audio.duration) audio.currentTime = $('seek').value / 100 * audio.duration; seeking = false; });
audio.addEventListener('timeupdate', () => { if (seeking || !audio.duration) return; $('seek').value = audio.currentTime / audio.duration * 100; $('cur').textContent = fmt(audio.currentTime); });
try { if ('mediaSession' in navigator) { navigator.mediaSession.setActionHandler('nexttrack', () => step(1)); navigator.mediaSession.setActionHandler('previoustrack', () => step(-1)); } } catch (e) {}
show(Math.max(0, ALBUMS.findIndex(A => '#' + A.id === location.hash)));
</script>
